name: Validate SmartOne XMLTV guide
on:
  push:
    paths:
      - ".github/workflows/epg-pw-guide-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check XMLTV URLs and channel IDs
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,gzip,xml.etree.ElementTree as ET,json,re
          urls=["https://epg.pw/xmltv/epg_lite.xml.gz","https://epg.pw/xmltv/epg.xml.gz"]
          targets=["Al Jazeera","Al Arabiya","France 24","Euronews","DW Arabic","CBS Sports","MBC","FIFA","Qatar TV"]
          def norm(s): return re.sub(r'[^a-z0-9]+','',s.lower())
          for url in urls:
           print("GUIDE_PROBE",url,flush=True)
           try:
            r=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=35)
            print("GUIDE_RESPONSE",r.status,"CONTENT_LENGTH",r.headers.get("Content-Length"),flush=True)
            g=gzip.GzipFile(fileobj=r)
            channels=[]
            for _,node in ET.iterparse(g,events=("end",)):
             t=node.tag.rsplit("}",1)[-1]
             if t=="channel":
              id=node.get("id","")
              names=[n.text for n in node.findall("display-name") if n.text]
              channels.append([id,names[:2]])
              node.clear()
             elif t=="programme":break
            print("GUIDE_CHANNEL_COUNT",len(channels),flush=True)
            for word in targets:
             found=[a for a in channels if norm(word) in norm(a[0]) or any(norm(word) in norm(n) for n in a[1])]
             print("GUIDE_MATCH",json.dumps({"guide":url,"query":word,"found":found[:8],"count":len(found)},ensure_ascii=False),flush=True)
           except Exception as e:
            print("GUIDE_ERROR",url,repr(e),flush=True)
          
          PY
